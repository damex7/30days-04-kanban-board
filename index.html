<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A keyboard- and touch-friendly Kanban board drawn like a blueprint." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230b2340'/><path d='M7 8h5v16H7zM14 8h5v10h-5zM21 8h5v6h-5z' fill='%23ff7a1a'/></svg>" />
    <title>Blueprint Kanban</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Runs before React and before the first paint, so the page never flashes
      the wrong theme. It reads the saved choice (or the OS setting) and puts
      data-theme on <html>. useTheme.js keeps it in sync afterwards.
    -->
    <script>
      try {
        var saved = localStorage.getItem('kanban-theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
